<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecionando</title>
<script>
  (function () {
    var p = location.pathname;

    // enderecos antigos continuam funcionando
    var mudados = { "/isa-carvalho-imoveis": "/isa" };
    for (var velho in mudados) {
      if (p === velho || p.indexOf(velho + "/") === 0) {
        location.replace(mudados[velho] + p.slice(velho.length) + location.search + location.hash);
        return;
      }
    }

    // endereco sem a barra final vira endereco com barra
    if (!/\/$/.test(p) && !/\.[a-z0-9]{2,5}$/i.test(p)) {
      location.replace(p + "/" + location.search + location.hash);
    }
  })();
</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F5F7F9;color:#0E161D;
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:2rem}
  a{color:#10406A;font-weight:600}
</style>
</head>
<body>
  <div>
    <p>Página não encontrada.</p>
    <p><a href="/">Voltar para a Criasiteweb</a></p>
  </div>
</body>
</html>
